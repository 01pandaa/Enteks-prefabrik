name: Siteyi yayınla
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # Özel alan adı alınca: Settings > Secrets and variables > Actions > Variables
      # SITE_URL=https://www.alanadiniz.com ve CNAME=www.alanadiniz.com ekleyin.
      - run: node src/build.js
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://01pandaa.github.io/enteks-prefabrik' }}
          CNAME: ${{ vars.CNAME }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
